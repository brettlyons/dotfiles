# Distrobox configuration for GPU-enabled Kali Linux with network capabilities
# Deploy with: distrobox assemble create

[kali-gpu]
image=docker.io/kalilinux/kali-rolling:latest
root=true
pull=false
nvidia=true
additional_packages="kali-linux-headless nvidia-cuda-toolkit nvidia-opencl-icd clinfo"
init_hooks=getent passwd 1000 | awk -F: "{print \$1 \" ALL=(ALL) NOPASSWD: ALL\" > \"/etc/sudoers.d/zz-\" \$1}"
